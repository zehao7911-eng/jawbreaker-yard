<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#263f46"><meta property="og:title" content="Jawbreaker Yard"><meta property="og:image" content="cover.jpg"><meta name="description" content="Aim a hydraulic jaw. Bite out the supports. Bring the whole block down."><title>Jawbreaker Yard · 3D Demolition</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"></head>
